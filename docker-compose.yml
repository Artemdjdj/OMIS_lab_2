services:
  postgres:
    image: postgres:latest
    container_name: omis_postgres
    environment:
      POSTGRES_DB: "db"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/lab2
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:

